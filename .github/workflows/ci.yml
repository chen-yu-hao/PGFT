name: PGFT C++20 & Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++20 & OpenBLAS/Eigen3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libopenblas-dev liblapacke-dev libeigen3-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pyscf pybind11 pytest
          pip install --no-build-isolation -e .

      - name: Build C++20 libpgft_core & _pgft_cpp pybind11 extension
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(which python)"
          cmake --build build -j "$(nproc)"

      - name: Run C++20 standalone CTest suite
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python AST, exact-limit & C++/Python parity pytest suite
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          pytest -v tests/test_pgft_pytest.py
